<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MOT-02 Animation Review</title>
<style>
  body { font-family: sans-serif; background: #1a1a1a; color: #eee; padding: 20px; max-width: 1100px; margin: 0 auto; }
  h1 { text-align: center; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 16px; }

  .connect-bar { text-align: center; margin: 12px 0; padding: 10px; background: #2a2a2a; border-radius: 10px; }
  .connect-bar input { padding: 7px 10px; font-size: 13px; border-radius: 6px; border: 1px solid #555; background: #333; color: #eee; width: 200px; text-align: center; }
  .connect-bar button { padding: 7px 14px; font-size: 13px; border-radius: 6px; border: none; cursor: pointer; margin-left: 6px; font-weight: 600; }
  .connect-bar .conn-btn { background: #ffd43b; color: #000; }
  .connect-bar .reset-btn { background: #555; color: #eee; }
  #jibo-status { font-size: 12px; margin-top: 4px; color: #888; }

  .toolbar { display: flex; gap: 8px; justify-content: center; margin: 16px 0; flex-wrap: wrap; align-items: center; }
  .toolbar button { padding: 7px 14px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
  .toolbar .export-btn { background: #748ffc; color: #fff; }
  .toolbar .filter-btn { background: #333; color: #aaa; }
  .toolbar .filter-btn.active { background: #ffd43b; color: #000; }
  .stats { color: #888; font-size: 12px; }

  .pool-label { color: #ffd43b; font-size: 14px; font-weight: 700; margin: 20px 0 6px; padding: 4px 0; border-bottom: 1px solid #333; }
  .pool-desc { color: #666; font-size: 11px; margin-bottom: 8px; }

  .anim-row { display: inline-flex; align-items: center; gap: 3px; margin: 3px; }
  .anim-name { padding: 6px 10px; border-radius: 6px; font-size: 12px; font-family: monospace; cursor: pointer; min-width: 80px; text-align: center; }
  .anim-name:hover { opacity: 0.85; }
  .anim-name.in-pool { background: #69db7c; color: #000; }
  .anim-name.rejected { background: #ff6b6b; color: #000; text-decoration: line-through; }
  .anim-name.available { background: #444; color: #aaa; }

  .vote-btn { width: 24px; height: 24px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .vote-btn.approve { background: #333; color: #666; }
  .vote-btn.approve.voted { background: #69db7c; color: #000; }
  .vote-btn.reject { background: #333; color: #666; }
  .vote-btn.reject.voted { background: #ff6b6b; color: #000; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<h1>MOT-02 Animation Review</h1>
<p class="subtitle">Click any animation to play on Jibo. Use ✓/✗ to approve or reject. Export when done.</p>

<div class="connect-bar">
  <input id="jibo-host" type="text" placeholder="Jibo IP" value="172.24.84.101" />
  <button class="conn-btn" onclick="connectJibo()">Connect</button>
  <button class="reset-btn" onclick="playAnim('default')">Reset</button>
  <div id="jibo-status">Click Connect to play animations on Jibo</div>
</div>

<div class="toolbar">
  <span class="stats" id="stats"></span>
  <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
  <button class="filter-btn" data-filter="in-pool" onclick="setFilter('in-pool')">In Pool</button>
  <button class="filter-btn" data-filter="rejected" onclick="setFilter('rejected')">Rejected</button>
  <button class="filter-btn" data-filter="available" onclick="setFilter('available')">Not Used</button>
  <button class="filter-btn" data-filter="approved" onclick="setFilter('approved')">✓ Approved</button>
  <button class="filter-btn" data-filter="rejected-vote" onclick="setFilter('rejected-vote')">✗ Rejected</button>
  <button class="export-btn" onclick="exportCSV()">Export CSV</button>
</div>

<div id="content"></div>

<script>
var POOLS = {
  praising: { desc: 'Victory, achievement, pride', anims: ['confident_01','confident_02','confident_03','confident_04','confident_05','success_01','success_02'] },
  excited: { desc: 'Joy, celebration, hope', anims: ['excited_00','excited_01','excited_02','excited_03','excited_04','excited_05','happy_03','happy_04','happy_05','happy_06','happy_07'] },
  sad: { desc: 'Loss, rejection, things going wrong', anims: ['sad_01','Sad_03','Sad_04','Sad_05','Sad_06'] },
  thinking: { desc: 'Processing, reflecting', anims: ['Thinking_06','Thinking_02','Thinking_03','Thinking_04','Thinking_05','thinking_00','thinking_07','thinking_08','thinking_09','thinking_10','thinking_11','thinking_12','thinking_13','thinking_14'] },
  surprised: { desc: 'Unexpected twist', anims: ['surprised_00','surprised_01','surprised_02','surprised_03','surprised_04','surprised_05','surprised_06'] },
  worried: { desc: 'Fear, anxiety, danger', anims: ['worried_01','worried_02','worried_03','worried_04','scared_00','scared_01','scared_02','scared_03','quiver-01','quiver-02','quiver-03'] },
  warmth: { desc: 'Love, belonging, comfort', anims: ['blush_01','blush_02','blush_03','blush_04','blush_06','content_01'] },
  affection: { desc: 'Closeness, bonding', anims: ['affection_01','affection_02','affection_03','affection_04','affection_05','affection_06'] },
  listening: { desc: 'Nods, acknowledgment', anims: ['yep_01','yep_02','yep_03','yep_04','GotIt_02','listen_head_bob_01'] },
  laughter: { desc: 'Funny moments', anims: ['laughter_01','laughter_02','laughter_03','laughter_04','laughter_05','laughter_06'] },
  disgusted: { desc: 'Gross, repulsive', anims: ['disgusted_01','disgusted_02'] },
  frustrated: { desc: 'Struggling, hitting a wall', anims: ['frustrated_00','frustrated_01','frustrated_02'] },
  confused: { desc: 'Bewilderment, "huh?"', anims: ['confused_01','confused_02','confused_03','confused_04','confused_04_nm','confused_05','confused_05_nm','confused_06_nm','confused_07_nm','dont_understand_01','dont_understand_02','puzzled_01','puzzled_02','puzzled_03','curious_01','curious_02'] },
  nope: { desc: 'Refusal, denial', anims: ['nope_00','nope_01','nope_02','nope_03'] },
  exclamation: { desc: 'Shock, gasp', anims: ['exclamation_01','exclamation_02'] },
  relieved: { desc: 'Tension releasing', anims: ['relieved_01','relieved_02'] },
  sorry: { desc: 'Guilt, regret', anims: ['sorry_01','sorry_03'] },
  shy: { desc: 'Embarrassment', anims: ['shy_01','shy_02','embarassed_01','embarassed_02'] },
  lightbulb: { desc: 'Realization, "aha!"', anims: ['thinking_lightbulb','thinking_lightbulb_02','thinking_lightbulb_03','thinking_lightbulb_04','thinking_lightbulb_05'] }
};

var REJECTED = ['happy_01','happy_02','sad_02','Thinking_01','surprised_07','greetings_04','Eye_Curious_01','Sway_01'];

var AVAILABLE = {
  'Eye States': ['eye_happy_00','eye_happy_01','eye_happy_02','eye_sad_01','eye_sad_02','eye_scared_00','eye_scared_01','eye_scared_02','eye_angry_in_01','eye_angry_out_01','eye_annoyed_in_01','eye_annoyed_out_01','eye_affection_in_01','eye_affection_out_01','eye_curious_01','eye_thinking_01','eye_thinking_02','eye_surprised_in_01','eye_disgusted_01','eye_disgusted_02','eye_tired_in_01','eye_unimpressed_bored_in_01','eye_laugh_in_00'],
  'Personality': ['ei_mutter_03','ei_um_01','ei_purring_01','ei_whistle_01','ei_yawn_01','ei_yawn_02','ei_yawn_03','yawn_01','yawn_02','yawn_03','sneeze_01','sneeze_02'],
  'Greetings / Goodbye': ['greetings_01','greetings_02','greetings_03','greetings_05','greetings_06','greetings_07','greetings_08','greetings_09','goodbye_04','goodbye_05','goodbye_06'],
  'Listening / Engagement': ['engaged-02','engaged-04','engaged-05','disengaged-01','disengaged-02','disengaged-04','disengaged-05','initiation_01','initiation_02','initiation_03'],
  'Checking / Questions': ['checking_00','checking_01','checking_02','checking_03','checking_04','checking_05','checking_06','checking_07','checking_08','question_02','question_03','question_04'],
  'Other': ['gotit_01','youre_welcome_01','youre_welcome_02','happy_lucky_00','happy_lucky_01','tickle_head_01','tickle_head_02']
};

// All animation names in a flat set for lookup
var inPoolSet = new Set();
Object.values(POOLS).forEach(function(p) { p.anims.forEach(function(a) { inPoolSet.add(a); }); });
var rejectedSet = new Set(REJECTED);

var votes = JSON.parse(localStorage.getItem('mot02-votes') || '{}');
var currentFilter = 'all';

function getStatus(name) {
  if (inPoolSet.has(name)) return 'in-pool';
  if (rejectedSet.has(name)) return 'rejected';
  return 'available';
}

function render() {
  var html = '';
  var totalAnims = 0, inPool = 0, rejected = 0, available = 0, approved = 0, rejectedVote = 0;

  // Pools
  Object.keys(POOLS).forEach(function(pool) {
    var p = POOLS[pool];
    html += '<div class="pool-label">' + pool + ' <span style="color:#888;font-size:12px;font-weight:400">(' + p.anims.length + ')</span></div>';
    html += '<div class="pool-desc">' + p.desc + '</div>';
    p.anims.forEach(function(a) {
      html += animHTML(a, 'in-pool');
      totalAnims++; inPool++;
      if (votes[a] === 'approve') approved++;
      if (votes[a] === 'reject') rejectedVote++;
    });
  });

  // Rejected
  html += '<div class="pool-label" style="color:#ff6b6b">Rejected / Broken</div>';
  html += '<div class="pool-desc">Tested and removed — broken screen, audio issues, or not suitable</div>';
  REJECTED.forEach(function(a) {
    html += animHTML(a, 'rejected');
    totalAnims++; rejected++;
    if (votes[a] === 'approve') approved++;
    if (votes[a] === 'reject') rejectedVote++;
  });

  // Available
  Object.keys(AVAILABLE).forEach(function(cat) {
    html += '<div class="pool-label" style="color:#888">' + cat + ' <span style="font-size:12px;font-weight:400">(not in pools)</span></div>';
    AVAILABLE[cat].forEach(function(a) {
      html += animHTML(a, 'available');
      totalAnims++; available++;
      if (votes[a] === 'approve') approved++;
      if (votes[a] === 'reject') rejectedVote++;
    });
  });

  document.getElementById('content').innerHTML = html;
  document.getElementById('stats').textContent = totalAnims + ' total · ' + inPool + ' in pools · ' + rejected + ' rejected · ' + available + ' not used · ' + approved + ' ✓ · ' + rejectedVote + ' ✗';
  applyFilter();
}

function animHTML(name, status) {
  var v = votes[name] || '';
  var filterClass = status;
  if (v === 'approve') filterClass += ' approved';
  if (v === 'reject') filterClass += ' rejected-vote';
  return '<span class="anim-row" data-status="' + status + '" data-vote="' + v + '">' +
    '<span class="anim-name ' + status + '" onclick="playAnim(\'' + name + '\')">' + name + '</span>' +
    '<button class="vote-btn approve ' + (v === 'approve' ? 'voted' : '') + '" onclick="vote(\'' + name + '\',\'approve\',this)">✓</button>' +
    '<button class="vote-btn reject ' + (v === 'reject' ? 'voted' : '') + '" onclick="vote(\'' + name + '\',\'reject\',this)">✗</button>' +
    '</span>';
}

function vote(name, type, btn) {
  if (votes[name] === type) { delete votes[name]; } else { votes[name] = type; }
  localStorage.setItem('mot02-votes', JSON.stringify(votes));
  var row = btn.closest('.anim-row');
  row.dataset.vote = votes[name] || '';
  row.querySelector('.approve').classList.toggle('voted', votes[name] === 'approve');
  row.querySelector('.reject').classList.toggle('voted', votes[name] === 'reject');
  updateStats();
}

function updateStats() {
  var approved = 0, rejectedVote = 0;
  Object.values(votes).forEach(function(v) { if (v === 'approve') approved++; if (v === 'reject') rejectedVote++; });
  var el = document.getElementById('stats');
  var parts = el.textContent.split('·');
  parts[parts.length - 2] = ' ' + approved + ' ✓ ';
  parts[parts.length - 1] = ' ' + rejectedVote + ' ✗';
  el.textContent = parts.join('·');
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.filter === f); });
  applyFilter();
}

function applyFilter() {
  document.querySelectorAll('.anim-row').forEach(function(row) {
    var status = row.dataset.status;
    var vote = row.dataset.vote;
    var show = currentFilter === 'all' ||
      (currentFilter === 'in-pool' && status === 'in-pool') ||
      (currentFilter === 'rejected' && status === 'rejected') ||
      (currentFilter === 'available' && status === 'available') ||
      (currentFilter === 'approved' && vote === 'approve') ||
      (currentFilter === 'rejected-vote' && vote === 'reject');
    row.classList.toggle('hidden', !show);
  });
}

function exportCSV() {
  var rows = [['Animation', 'Pool/Category', 'Status', 'Vote']];
  Object.keys(POOLS).forEach(function(pool) {
    POOLS[pool].anims.forEach(function(a) {
      rows.push([a, pool, 'in-pool', votes[a] || '']);
    });
  });
  REJECTED.forEach(function(a) { rows.push([a, 'rejected', 'rejected', votes[a] || '']); });
  Object.keys(AVAILABLE).forEach(function(cat) {
    AVAILABLE[cat].forEach(function(a) { rows.push([a, cat, 'available', votes[a] || '']); });
  });
  var csv = rows.map(function(r) { return r.join(','); }).join('\n');
  var blob = new Blob([csv], { type: 'text/csv' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'mot02-animation-review.csv'; a.click();
  URL.revokeObjectURL(url);
}

// MCP
var mcpUrl = '', sessionId = null, mcpId = 1;
function connectJibo() {
  var host = document.getElementById('jibo-host').value.trim();
  var statusEl = document.getElementById('jibo-status');
  [9011, 9010].reduce(function(p, port) {
    return p.catch(function() {
      statusEl.textContent = 'Trying ' + host + ':' + port + '...';
      statusEl.style.color = '#ffd43b';
      return fetch('http://' + host + ':' + port + '/mcp', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jsonrpc: '2.0', id: mcpId++, method: 'initialize', params: {} })
      }).then(function(r) {
        sessionId = r.headers.get('Mcp-Session-Id');
        if (!sessionId) throw new Error('no session');
        mcpUrl = 'http://' + host + ':' + port + '/mcp';
        statusEl.textContent = 'Connected to ' + host + ':' + port;
        statusEl.style.color = '#69db7c';
      });
    });
  }, Promise.reject()).catch(function() {
    statusEl.textContent = 'Failed to connect';
    statusEl.style.color = '#ff6b6b';
  });
}

function playAnim(name) {
  var statusEl = document.getElementById('jibo-status');
  if (!sessionId) { statusEl.textContent = 'Not connected'; statusEl.style.color = '#ff6b6b'; return; }
  statusEl.textContent = 'Playing: ' + name;
  statusEl.style.color = '#ffd43b';
  fetch(mcpUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Mcp-Session-Id': sessionId },
    body: JSON.stringify({ jsonrpc: '2.0', id: mcpId++, method: 'tools/call', params: { name: 'play_motion', arguments: { name: name } } })
  }).then(function(r) { return r.json(); }).then(function(r) {
    statusEl.textContent = r.result?.content?.[0]?.text || JSON.stringify(r);
    statusEl.style.color = '#69db7c';
  }).catch(function(e) { statusEl.textContent = 'Error: ' + e.message; statusEl.style.color = '#ff6b6b'; });
}

render();
</script>

</body>
</html>
